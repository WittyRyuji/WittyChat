name: Release Alpha

on:
  push:
    tags: ["v*-alpha*"]
    branches: ["release/*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable alpha tag to package
        required: true
        default: v0.1.0-alpha

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve immutable source tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME#release/}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha(\.[0-9]+)?$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}

  package:
    needs: [metadata, verify]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Generate Wails bindings
        shell: pwsh
        run: |
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            go mod download
            if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (!$downloaded) { throw "Go dependency download failed after retries" }
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location desktop
          try {
            wails3 generate bindings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Install locked dependencies and build frontends
        shell: pwsh
        run: |
          npm install --global pnpm@12.16.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir admin install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir desktop/frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir admin build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir desktop/frontend build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package exact tagged sources
        shell: pwsh
        run: ./scripts/package-release.ps1 -ExpectedTag "${{ needs.metadata.outputs.tag }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [metadata, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "WittyChat $version" \
            --notes-file "docs/RELEASE_NOTES_${version}.md"
