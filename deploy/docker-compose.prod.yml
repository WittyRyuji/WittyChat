# Production topology: nginx terminates TLS in front of server+worker;
# maddy handles SMTP; minio is optional (commented) for the s3 backend.
#
# 生产拓扑：nginx 终止 TLS 在最前；maddy 处理 SMTP；
# minio 可选（注释掉），对象存本地盘也行。
#
# Prereqs: 自行提供 TLS 证书到 ./certs (fullchain.pem / privkey.pem)，
# 以及 .env 里的密钥（见 deploy/.env.example）。

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-wittychat}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
      POSTGRES_DB: wittychat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    image: wittychat-server:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      WITTYCHAT_DB_URL: postgres://${PG_USER:-wittychat}:${PG_PASSWORD}@postgres:5432/wittychat?sslmode=disable
      WITTYCHAT_ADDR: ":8080"
      WITTYCHAT_SECRET_KEY: ${WITTYCHAT_SECRET_KEY:?set WITTYCHAT_SECRET_KEY}
      WITTYCHAT_PUBLIC_URL: ${PUBLIC_URL:-https://im.example.com}
      WITTYCHAT_DATA_DIR: /data
      WITTYCHAT_MAIL_DOMAIN: ${MAIL_DOMAIN:-example.com}
      WITTYCHAT_S3_ENDPOINT: ${S3_ENDPOINT:-}
      WITTYCHAT_S3_BUCKET: ${S3_BUCKET:-}
      WITTYCHAT_S3_REGION: ${S3_REGION:-us-east-1}
      WITTYCHAT_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      WITTYCHAT_S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      WITTYCHAT_ONLYOFFICE_URL: ${ONLYOFFICE_URL:-}
      WITTYCHAT_ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      # In-network addressing: the docs container reaches this server by
      # service name; we fetch saved output from the docs container the
      # same way. ONLYOFFICE_URL stays the browser-facing address.
      # 同网段寻址：文档容器按服务名回连本服务，我们也按服务名取回成稿；
      # ONLYOFFICE_URL 保持浏览器可达地址。
      WITTYCHAT_ONLYOFFICE_CALLBACK_BASE: http://server:8080
      WITTYCHAT_ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      # Behind nginx: the rightmost X-Forwarded-For hop is the real client IP
      # (login throttling + audit). 生产走 nginx：XFF 最右一跳即真实来源。
      WITTYCHAT_TRUST_PROXY: "1"
    volumes:
      - objdata:/data
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  worker:
    image: wittychat-worker:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      WITTYCHAT_DB_URL: postgres://${PG_USER:-wittychat}:${PG_PASSWORD}@postgres:5432/wittychat?sslmode=disable
      WITTYCHAT_DATA_DIR: /data
      WITTYCHAT_MAIL_DOMAIN: ${MAIL_DOMAIN:-example.com}
      WITTYCHAT_S3_ENDPOINT: ${S3_ENDPOINT:-}
      WITTYCHAT_S3_BUCKET: ${S3_BUCKET:-}
      WITTYCHAT_S3_REGION: ${S3_REGION:-us-east-1}
      WITTYCHAT_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      WITTYCHAT_S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - objdata:/data
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  maddy:
    image: docker.io/foxcpp/maddy:0.8
    environment:
      MADDY_HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}
      MADDY_DOMAIN: ${MAIL_DOMAIN:-example.com}
    ports:
      - "25:25"     # inbound smtp
      - "587:587"   # submission
      - "993:993"   # imap tls (future client access)
    volumes:
      - maddydata:/data
    restart: unless-stopped

  # OnlyOffice Document Server — office attachment editing. Browsers need
  # to reach it, so publish a port and point ONLYOFFICE_URL at the public
  # address (own vhost/TLS recommended for production).
  # OnlyOffice 文档服务：办公附件在线编辑。浏览器需要直连，故发布端口；
  # ONLYOFFICE_URL 指向公网可达地址（生产建议独立 vhost+TLS）。
  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
    ports:
      - "8180:80"
    volumes:
      - oodata:/var/www/onlyoffice/Data
      - oologs:/var/log/onlyoffice
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"     # redirect → https
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [server]
    restart: unless-stopped

  # ---- optional: bundled S3 for local-first deploys without AWS ----
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
  #     MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
  #   volumes: [miniodata:/data]
  #   restart: unless-stopped

volumes:
  pgdata:
  objdata:
  maddydata:
  oodata:
  oologs:
  # miniodata:
