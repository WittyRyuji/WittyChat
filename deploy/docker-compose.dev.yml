# Dev-only dependencies. Production compose lands with deployment work.
# 开发环境依赖。生产 compose 随部署工作再出。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wittychat
      POSTGRES_PASSWORD: wittychat
      POSTGRES_DB: wittychat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wittychat"]
      interval: 5s
      timeout: 3s
      retries: 10

  # maddy: all-in-one SMTP/IMAP server for the mail module.
  # Dev runs unauthenticated submission on :1587; inbound :25 needs a real
  # DNS/MX setup — kept for local container-to-container testing.
  # maddy：一体化邮件服务器。开发态用 :1587 免认证提交；
  # 入站 :25 需要真实 DNS/MX 配置。
  maddy:
    image: docker.io/foxcpp/maddy:0.8
    environment:
      MADDY_HOSTNAME: mail.wittyloong.com
      MADDY_DOMAIN: wittyloong.com
    ports:
      - "1025:25"   # smtp inbound (host port 1025 → container 25)
      - "1143:143"  # imap (future)
      - "1587:587"  # submission
    volumes:
      - maddydata:/data

  # OnlyOffice Document Server — online editing for office attachments.
  # JWT_SECRET must match the server's WITTYCHAT_ONLYOFFICE_JWT_SECRET.
  # host.docker.internal lets the container reach the Go server on the host.
  # OnlyOffice 文档服务：办公附件在线编辑。JWT_SECRET 与服务端
  # WITTYCHAT_ONLYOFFICE_JWT_SECRET 保持一致；host.docker.internal
  # 供容器反向访问宿主机上的 Go 服务（拉文件、保存回调）。
  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-wittychat-office-dev}
      JWT_HEADER: Authorization
    ports:
      - "8180:80"
    volumes:
      - oodata:/var/www/onlyoffice/Data
      - oologs:/var/log/onlyoffice
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
  maddydata:
  oodata:
  oologs:
