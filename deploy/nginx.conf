# WittyChat production front door: TLS + /api + /ws + /admin + activate page.
# server: wittychat-server:8080 inside compose network.

upstream wittychat_backend {
    server server:8080;
}

# Never log query strings: object/doc/WS links carry credentials
# (session token or exp+sig) in the URI. $uri excludes the query.
# 访问日志不落查询串：对象/文档/WS 链接的 URI 携带凭据（会话 token
# 或 exp+sig）；$uri 不含查询参数。
log_format witty '$remote_addr - $remote_user [$time_local] '
                '"$request_method $uri" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log witty;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/access.log witty;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 64m; # direct uploads; s3 path bypasses nginx anyway

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /ws {
        proxy_pass http://wittychat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://wittychat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
