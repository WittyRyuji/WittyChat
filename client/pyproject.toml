[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wittychat-client"
version = "0.1.0"
description = "WittyChat desktop client"
requires-python = ">=3.11"
dependencies = [
    "wittychat-shared",
    "PySide6-Essentials>=6.7",
    "httpx>=0.27",
    "websockets>=12",
    "keyring>=25",
    "markdown-it-py>=3",
    "pygments>=2.17",
]

[project.scripts]
wittychat = "wittychat_client.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wittychat_client = ["qml/*.qml"]
