<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WittyChat 管理后台{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
{% if admin %}
<header class="topbar">
  <span class="brand">WittyChat 管理后台</span>
  <nav>
    <a href="/admin/" class="{{ 'active' if nav == 'dashboard' }}">概览</a>
    <a href="/admin/users" class="{{ 'active' if nav == 'users' }}">用户</a>
    <a href="/admin/channels" class="{{ 'active' if nav == 'channels' }}">频道</a>
    <a href="/admin/settings" class="{{ 'active' if nav == 'settings' }}">系统设置</a>
  </nav>
  <form method="post" action="/admin/logout" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <span class="muted">{{ admin.display_name }}</span>
    <button type="submit" class="link">退出</button>
  </form>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
