{% extends "base.html" %}
{% block content %}
<h1>概览</h1>
<div class="stats">
  <div class="stat"><span class="value">{{ stats.users }}</span><span class="label">在职用户</span></div>
  <div class="stat"><span class="value">{{ stats.online }}</span><span class="label">当前在线（本进程）</span></div>
  <div class="stat"><span class="value">{{ stats.channels }}</span><span class="label">频道</span></div>
  <div class="stat"><span class="value">{{ stats.dms }}</span><span class="label">私聊会话</span></div>
  <div class="stat"><span class="value">{{ stats.messages }}</span><span class="label">消息总数</span></div>
  <div class="stat"><span class="value">{{ "%.1f"|format(stats.storage_bytes / 1048576) }} MB</span><span class="label">文件占用（去重后）</span></div>
</div>
{% endblock %}
