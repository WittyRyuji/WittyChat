[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wittychat-server"
version = "0.1.0"
description = "WittyChat server"
requires-python = ">=3.11"
dependencies = [
    "wittychat-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "joserfc>=1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
wittychat-server = "wittychat_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wittychat_server = ["admin/templates/*.html", "admin/static/*", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
